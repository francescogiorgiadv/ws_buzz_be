spring.application.name=ws-buzz-backend

server.port=8080

# Java 21 virtual threads: ogni richiesta HTTP/WebSocket gira su un thread
# "leggero" -> ottimo per tante connessioni concorrenti (giocatori in attesa
# di premere il buzzer) senza pool di thread dedicati.
spring.threads.virtual.enabled=true

# Origini ammesse per CORS (REST) e per l'handshake WebSocket. In dev punta
# al dev server di Angular; in produzione andra' sovrascritta (env var o
# profilo) con il dominio reale del frontend.
app.cors.allowed-origins=http://localhost:4200
