spring.application.name=ws-buzz-backend

server.port=8080

# In produzione l'app gira dietro un reverse proxy (Nginx/Caddy) che termina
# HTTPS: con "native" Tomcat legge X-Forwarded-For/-Proto/-Host e ricostruisce
# schema, host e IP reali del client. Gli header vengono accettati solo se la
# richiesta arriva da un IP interno (localhost, 10.x, 192.168.x, 172.16-31.x),
# quindi un client esterno non puo' falsificarli.
server.forward-headers-strategy=native

# Java 21 virtual threads: ogni richiesta HTTP/WebSocket gira su un thread
# "leggero" -> ottimo per tante connessioni concorrenti (giocatori in attesa
# di premere il buzzer) senza pool di thread dedicati.
spring.threads.virtual.enabled=true

# Origini ammesse per CORS (REST) e per l'handshake WebSocket, separate da
# virgola senza spazi (es. https://buzz.example.com,https://www.buzz.example.com).
# Nessun default: in produzione la variabile d'ambiente APP_CORS_ALLOWED_ORIGINS
# e' obbligatoria e senza di essa l'applicazione non parte. In dev il valore
# arriva da application-dev.properties (profilo "dev").
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
