# docker-compose.yml del server: va copiato in /opt/ws-buzz/docker-compose.yml.
# Vedi DEPLOY_DOCKER_BUILD_PC.md (fase F2).
#
# Nessuna immagine da costruire: i container usano le immagini ufficiali e leggono
# i file della release attiva (current -> releases/<data-ora>), caricata da
# scripts/deploy-ws-buzz.ps1. Non avviarlo a mano prima della prima release.
#
# Richiede nella stessa cartella:
#   .env       DOMAIN=... e ACME_EMAIL=...   (vedi .env.example)
#   Caddyfile                                (vedi Caddyfile)

name: ws-buzz

services:
  backend:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    user: "65534:65534"            # utente senza privilegi (nobody)
    working_dir: /tmp
    command: ["java", "-jar", "/release/app.jar"]
    environment:
      # Ricavata dal dominio: e' l'unica origine da cui il browser chiama il backend.
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?imposta DOMAIN nel file .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Europe/Rome
    volumes:
      - type: bind
        source: ./current/app.jar
        target: /release/app.jar
        read_only: true
        bind:
          create_host_path: false  # se manca la release, errore invece di creare cartelle vuote
    mem_limit: 512m
    # nessuna "ports": raggiungibile solo dalla rete interna di Docker

  frontend:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - type: bind
        source: ./current/browser
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./current/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m
    # "healthy" = Nginx risponde E il backend e' raggiungibile attraverso di lui.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?imposta DOMAIN nel file .env}
      ACME_EMAIL: ${ACME_EMAIL:?imposta ACME_EMAIL nel file .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:     # certificati HTTPS: NON cancellarlo
  caddy_config:
